version: '3.8'

services:
    mc:
        container_name: minecraft
        image: itzg/minecraft-server
        environment:
            MEMORY: '8G'
            EULA: 'true'
            TYPE: 'PAPER'
            PLUGINS: |
                https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
                https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
        ports:
            - '25565:25565'
            - '19132:19132/udp'
        volumes:
            - minecraft-data:/data
        dns:
            - 192.168.4.61
            - 1.1.1.1

    trek:
        container_name: trek
        image: mauriceboe/trek:latest
        environment:
            - NODE_ENV=production
            - JWT_SECRET=${TREK_JWT_SECRET:-}
            - PORT=3000
        volumes:
            - /volume2/docker/services/trek/data:/app/data
            - /volume2/docker/services/trek/uploads:/app/uploads
        ports:
            - '3010:3000'
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 15s
        dns:
            - 192.168.4.61
            - 1.1.1.1

volumes:
    minecraft-data:
