name: Trigger Portainer Webhook

on:
    push:
        branches:
            - main

jobs:
    trigger_webhook:
        runs-on: ubuntu-latest
        steps:
            - name: Trigger Portainer Webhook
              # Portainer sits behind Cloudflare Access; the service token gets CI through.
              run: >-
                  curl --fail -X POST
                  -H "CF-Access-Client-Id: ${{ secrets.CF_ACCESS_CLIENT_ID }}"
                  -H "CF-Access-Client-Secret: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}"
                  https://portainer.robbedekien.be/api/stacks/webhooks/f38e98b8-0d1c-45fd-a153-2bb88263dae2
