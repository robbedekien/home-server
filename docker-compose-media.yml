version: "3.8"

services:
  plex:
    image: linuxserver/plex:latest
    container_name: plex
    # Using host network mode is often easier for Plex discovery on a local network.
    # Alternatively, you could use bridge mode and map ports:
    ports:
      - "32400:32400/tcp"
      #   - "3005:3005/tcp"
      #   - "1900:1900/udp"
      - "8324:8324/tcp"
      - "32469:32469/tcp"
      - "32410:32410/udp"
      - "32412:32412/udp"
      - "32413:32413/udp"
      - "32414:32414/udp"
    dns:
      - 192.168.4.61
      - 1.1.1.1
    environment:
      # Replace 1000 with your actual user and group ID.
      # Find them by running `id -u` and `id -g` in your terminal.
      - PUID=1026
      - PGID=100
      - VERSION=docker
      # Optional: Claim token for headless setup.
      # Get one from https://www.plex.tv/claim and paste it here if needed.
      # - PLEX_CLAIM=YOUR_CLAIM_TOKEN
    volumes:
      # Persist Plex configuration
      - /volume2/docker/services/plex/config:/config
      # Mount your media libraries (adjust paths if your 'data' dir is elsewhere)
      - /volume1/media/tv:/data/tvshows
      - /volume1/media/movies:/data/movies
      # Add more volumes here for other media types like music or photos
    restart: unless-stopped

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Etc/UTC
    volumes:
      - /volume2/docker/services/radarr/config:/config
      - /volume1/media/movies:/movies
      - /volume2/docker/downloads:/downloads
    ports:
      - "7878:7878"
    dns:
      - 192.168.4.61
      - 1.1.1.1
    restart: unless-stopped

  bookshelf:
    image: ghcr.io/pennydreadful/bookshelf:hardcover-v0.4.20.91
    container_name: bookshelf
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Etc/UTC
    volumes:
      - /volume2/docker/services/bookshelf/config:/config
      - /volume1/media/books:/books
      - /volume2/docker/downloads:/downloads
    ports:
      - "8787:8787"
    dns:
      - 192.168.4.61
      - 1.1.1.1
    restart: unless-stopped

  bookshelf-audiobooks:
    image: ghcr.io/pennydreadful/bookshelf:hardcover-v0.4.20.91
    container_name: bookshelf-audiobooks
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Etc/UTC
    volumes:
      - /volume2/docker/services/bookshelf-audiobooks/config:/config
      - /volume1/media/audiobooks:/audiobooks
      - /volume2/docker/downloads:/downloads
    ports:
      - "8788:8787"
    dns:
      - 192.168.4.61
      - 1.1.1.1
    restart: unless-stopped

  # Self-hosted metadata for both bookshelf instances; the shared hardcover.bookinfo.pro search hangs.
  # Bookshelf reaches it at http://rreading-glasses:8788 (Settings > /settings/development).
  rreading-glasses:
    image: blampe/rreading-glasses:hardcover
    container_name: rreading-glasses
    entrypoint: ["/main", "serve"]
    mem_limit: 256m
    environment:
      HARDCOVER_AUTH: ${HARDCOVER_AUTH:?set in Portainer, "Bearer <token>"}
      POSTGRES_HOST: rreading-glasses-db
      POSTGRES_DATABASE: rreading-glasses
      POSTGRES_USER: rreading-glasses
      POSTGRES_PASSWORD: ${RREADING_GLASSES_DB_PASSWORD:?set in Portainer}
    depends_on:
      - rreading-glasses-db
    restart: unless-stopped

  rreading-glasses-db:
    image: postgres:17
    container_name: rreading-glasses-db
    environment:
      POSTGRES_USER: rreading-glasses
      POSTGRES_PASSWORD: ${RREADING_GLASSES_DB_PASSWORD:?set in Portainer}
      POSTGRES_DB: rreading-glasses
    volumes:
      - /volume2/docker/services/rreading-glasses/db:/var/lib/postgresql/data
    restart: unless-stopped

  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Etc/UTC
    volumes:
      - /volume2/docker/services/sonarr/config:/config
      - /volume1/media/tv:/tv
      - /volume2/docker/downloads:/downloads
    ports:
      - "8989:8989"
    dns:
      - 192.168.4.61
      - 1.1.1.1
    restart: unless-stopped

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Etc/UTC
    volumes:
      - /volume2/docker/services/prowlarr/config:/config
    ports:
      - "9696:9696"
    dns:
      - 192.168.4.61
      - 1.1.1.1
    restart: unless-stopped

  overseerr:
    image: sctx/overseerr:latest
    container_name: overseerr
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Etc/UTC
    volumes:
      - /volume2/docker/services/overseerr/config:/app/config
    ports:
      - "5055:5055"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped

  qbittorrent:
    image: linuxserver/qbittorrent:5.2.4 # MAM only allows 5.0.1-5.2.x; 5.3.0 is rejected
    container_name: qbittorrent
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
    volumes:
      - /volume2/docker/services/qbittorrent/config:/config
      - /volume2/docker/downloads:/downloads
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    dns:
      - 192.168.4.61
      - 1.1.1.1
    restart: unless-stopped

  threadfin:
    image: fyb3roptik/threadfin:latest
    container_name: threadfin
    ports:
      - 34401:34400
    dns:
      - 192.168.4.61
      - 1.1.1.1
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Etc/UTC
    volumes:
      - threadfin-config:/config
      - /volume2/docker/data/temp:/tmp/threadfin:rw
    restart: unless-stopped
  streammaster:
    image: ghcr.io/carlreid/streammaster:latest
    container_name: streammaster
    ports:
      - 7095:7095
      - 7096:7096
    dns:
      - 192.168.4.61
      - 1.1.1.1
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Etc/UTC
    volumes:
      - /volume2/docker/services/streammaster/config:/config
      - /volume2/docker/services/streammaster/tv-logos:/config/tv-logos
    restart: unless-stopped

  tautulli:
    image: ghcr.io/tautulli/tautulli
    container_name: tautulli
    restart: unless-stopped
    volumes:
      - /volume2/docker/services/tautulli/config:/config
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Etc/UTC
    ports:
      - 8181:8181
    dns:
      - 192.168.4.61
      - 1.1.1.1

  sabnzbd:
    image: linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Etc/UTC
    volumes:
      - /volume2/docker/services/sabnzbd/config:/config
      - /volume2/docker/downloads:/downloads
    ports:
      - 8088:8080
    dns:
      - 192.168.4.61
      - 1.1.1.1
    restart: unless-stopped

  # Removes, blocklists and re-searches stuck imports (exe fakes, "unable to determine if sample").
  # Configure in the UI: Sonarr http://sonarr:8989, Radarr http://radarr:7878, qBittorrent http://qbittorrent:8080.
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    environment:
      - PORT=11011
      - PUID=1026
      - PGID=100
      - TZ=Etc/UTC
    volumes:
      - /volume2/docker/services/cleanuparr/config:/config
    ports:
      - "11011:11011"
    restart: unless-stopped

  bazarr:
    image: linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=1026
      - PGID=100
      - TZ=Etc/UTC
    volumes:
      - /volume2/docker/services/bazarr/config:/config
      # Mount movie and TV show folders for subtitle management
      - /volume1/media/movies:/movies
      - /volume1/media/tv:/tv
    ports:
      - "6767:6767"
    dns:
      - 192.168.4.61
      - 1.1.1.1
    restart: unless-stopped

networks:
  github_default:
    driver: bridge

volumes:
  threadfin-config:
